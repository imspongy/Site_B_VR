<g transform="translate(1030 420)"><g transform="scale(-1 1)"><path d="M-62 -18 A 118 118 0 1 1 62 -18 L 50 160 C 46 196 24 214 0 214 C -24 214 -46 196 -50 160 Z" fill="url(#body)" stroke="#5d7266" stroke-width="3"/>
<rect x="-80" y="10" width="18" height="100" rx="8" fill="#e8a33d" opacity="0.85"/></g><rect x="-15" y="-206" width="30" height="12" rx="6" fill="#2c3a33" stroke="#6d8378" stroke-width="2"/><circle cx="42" cy="-172" r="18" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/><text x="42" y="-165" text-anchor="middle" font-size="19" font-weight="800" fill="#cfd9d2">Y</text><circle cx="42" cy="-108" r="18" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/><text x="42" y="-101" text-anchor="middle" font-size="19" font-weight="800" fill="#cfd9d2">A</text><circle cx="10" cy="-140" r="18" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/><text x="10" y="-133" text-anchor="middle" font-size="19" font-weight="800" fill="#cfd9d2">X</text><circle cx="74" cy="-140" r="18" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/><text x="74" y="-133" text-anchor="middle" font-size="19" font-weight="800" fill="#cfd9d2">B</text><circle cx="-42" cy="-78" r="38" fill="#1b2620" stroke="#6d8378" stroke-width="3"/><circle cx="-42" cy="-78" r="24" fill="#2c3a33"/><circle cx="44" cy="-50" r="13" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/></g>
<path class="ln" d="M470 220 L 290 130 L 40 130"/><circle class="dot" cx="470" cy="220" r="6"/>
<text x="40" y="118" text-anchor="start" class="lbl">View: pause menu</text>
<path class="ln" d="M451 282 L 290 225 L 40 225"/><circle class="dot" cx="451" cy="282" r="6"/>
<text x="40" y="213" text-anchor="start" class="lbl">D-pad ← ↑ →: pause menu</text>
<path class="ln" d="M428 316 L 290 320 L 40 320"/><circle class="dot" cx="428" cy="316" r="6"/>
<text x="40" y="308" text-anchor="start" class="lbl">D-pad ↓: hint screen</text>
<path class="ln" d="M426 362 L 290 415 L 40 415"/><circle class="dot" cx="426" cy="362" r="6"/>
<text x="40" y="403" text-anchor="start" class="lbl">Steam button: not used</text>
<path class="ln" d="M399 480 L 290 510 L 40 510"/><circle class="dot" cx="399" cy="480" r="6"/>
<text x="40" y="498" text-anchor="start" class="lbl">Grip: grab and hold</text>
<text x="40" y="534" text-anchor="start" class="sub">Let go to drop, swing to throw</text>
<path class="ln" stroke-dasharray="6 5" d="M440 634 L 290 650 L 40 650"/><circle class="dot" cx="440" cy="634" r="6"/>
<text x="40" y="638" text-anchor="start" class="lbl">Trigger (underneath)</text>
<text x="40" y="674" text-anchor="start" class="sub">Fire a gun, use what you hold</text>
<path class="ln" d="M512 342 L 620 160 L 880 160"/><circle class="dot" cx="512" cy="342" r="6"/>
<text x="750" y="148" text-anchor="middle" class="lbl">Stick: walk</text>
<text x="750" y="184" text-anchor="middle" class="sub">Click: sprint, until you let go</text>
<path class="ln" d="M1030 220 L 1210 130 L 1460 130"/><circle class="dot" cx="1030" cy="220" r="6"/>
<text x="1460" y="118" text-anchor="end" class="lbl">Menu: pause menu</text>
<path class="ln" d="M1090 248 L 1210 225 L 1460 225"/><circle class="dot" cx="1090" cy="248" r="6"/>
<text x="1460" y="213" text-anchor="end" class="lbl">X, Y or B: crouch</text>
<path class="ln" d="M1090 312 L 1210 320 L 1460 320"/><circle class="dot" cx="1090" cy="312" r="6"/>
<text x="1460" y="308" text-anchor="end" class="lbl">A: jump</text>
<path class="ln" d="M1074 370 L 1210 415 L 1460 415"/><circle class="dot" cx="1074" cy="370" r="6"/>
<text x="1460" y="403" text-anchor="end" class="lbl">Steam button: not used</text>
<path class="ln" d="M1101 480 L 1210 510 L 1460 510"/><circle class="dot" cx="1101" cy="480" r="6"/>
<text x="1460" y="498" text-anchor="end" class="lbl">Grip: grab and hold</text>
<text x="1460" y="534" text-anchor="end" class="sub">Let go to drop, swing to throw</text>
<path class="ln" stroke-dasharray="6 5" d="M1060 634 L 1210 650 L 1460 650"/><circle class="dot" cx="1060" cy="634" r="6"/>
<text x="1460" y="638" text-anchor="end" class="lbl">Trigger (underneath)</text>
<text x="1460" y="674" text-anchor="end" class="sub">Fire a gun, use what you hold</text>
<path class="ln" d="M988 342 L 880 420 L 620 420"/><circle class="dot" cx="988" cy="342" r="6"/>
<text x="750" y="408" text-anchor="middle" class="lbl">Stick: turn</text>
<text x="750" y="444" text-anchor="middle" class="sub">Click: recenter (both: capture)</text>
<text x="750" y="762" text-anchor="middle" class="sub">Steam Frame uses SteamVR's automatic mapping of the Touch layout.  If a button differs, rebind it in SteamVR.</text>
<text x="750" y="790" text-anchor="middle" class="sub">Both hands grab, shoot and holster the same way.  LeftHanded=1 swaps the stick and button roles.  Everything can be rebound in SteamVR.</text>
</svg>