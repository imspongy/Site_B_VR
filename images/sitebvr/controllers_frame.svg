<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" font-family="Inter, 'DejaVu Sans', sans-serif">
<defs><linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4a42"/><stop offset="1" stop-color="#23302a"/></linearGradient>
<style>.lbl{font-size:21px;font-weight:700;fill:#efe6d2}.sub{font-size:17px;font-weight:500;fill:#a9c2a3}.ln{stroke:#e8a33d;stroke-width:2.5;fill:none}.dot{fill:#e8a33d}.ttl{font-size:30px;font-weight:900;fill:#efe6d2;letter-spacing:3px}.hd{font-size:36px;font-weight:900;fill:#e8a33d;letter-spacing:2px}</style></defs>
<rect width="1500" height="800" rx="24" fill="#0f2419"/>
<text x="750" y="52" text-anchor="middle" class="hd">STEAM FRAME CONTROLLERS</text>
<text x="470" y="96" text-anchor="middle" class="ttl">LEFT</text>
<text x="1030" y="96" text-anchor="middle" class="ttl">RIGHT</text>
<g transform="translate(470 400)"><path d="M-95 -170 C -95 -230 95 -230 95 -170 L 80 60 C 70 120 40 190 0 190 C -40 190 -70 120 -80 60 Z" fill="url(#body)" stroke="#5d7266" stroke-width="3"/>
<rect x="-112" y="-80" width="20" height="120" rx="9" fill="#e8a33d" opacity="0.85"/>
<circle cx="-20" cy="-140" r="42" fill="#1b2620" stroke="#6d8378" stroke-width="3"/>
<circle cx="-20" cy="-140" r="26" fill="#2c3a33"/><rect x="28" y="-108" width="24" height="24" rx="5" fill="#2c3a33" stroke="#6d8378" stroke-width="2.5"/><rect x="28" y="-56" width="24" height="24" rx="5" fill="#2c3a33" stroke="#6d8378" stroke-width="2.5"/><rect x="2" y="-82" width="24" height="24" rx="5" fill="#2c3a33" stroke="#6d8378" stroke-width="2.5"/><rect x="54" y="-82" width="24" height="24" rx="5" fill="#2c3a33" stroke="#6d8378" stroke-width="2.5"/><rect x="-13.0" y="-221.0" width="26" height="12" rx="6" fill="#2c3a33" stroke="#6d8378" stroke-width="2"/></g>
<g transform="translate(1030 400)"><g transform="scale(-1 1)"><path d="M-95 -170 C -95 -230 95 -230 95 -170 L 80 60 C 70 120 40 190 0 190 C -40 190 -70 120 -80 60 Z" fill="url(#body)" stroke="#5d7266" stroke-width="3"/>
<rect x="-112" y="-80" width="20" height="120" rx="9" fill="#e8a33d" opacity="0.85"/>
<circle cx="-20" cy="-140" r="42" fill="#1b2620" stroke="#6d8378" stroke-width="3"/>
<circle cx="-20" cy="-140" r="26" fill="#2c3a33"/></g><circle cx="-40" cy="-110" r="20" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/><text x="-40" y="-102.8" text-anchor="middle" font-size="20" font-weight="800" fill="#cfd9d2" transform="scale(1 1)">Y</text><circle cx="-40" cy="-30" r="20" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/><text x="-40" y="-22.8" text-anchor="middle" font-size="20" font-weight="800" fill="#cfd9d2" transform="scale(1 1)">A</text><circle cx="-80" cy="-70" r="20" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/><text x="-80" y="-62.8" text-anchor="middle" font-size="20" font-weight="800" fill="#cfd9d2" transform="scale(1 1)">X</text><circle cx="0" cy="-70" r="20" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/><text x="0" y="-62.8" text-anchor="middle" font-size="20" font-weight="800" fill="#cfd9d2" transform="scale(1 1)">B</text><rect x="-13.0" y="-221.0" width="26" height="12" rx="6" fill="#2c3a33" stroke="#6d8378" stroke-width="2"/></g>
<circle class="dot" cx="450" cy="260" r="6"/><path class="ln" d="M450 260 L 300 140 L 40 140"/>
<text x="40" y="128" text-anchor="start" class="lbl">Stick: walk</text>
<text x="40" y="164" text-anchor="start" class="sub">Push further to go faster</text>
<circle class="dot" cx="450" cy="260" r="6"/><path class="ln" d="M450 260 L 300 235 L 40 235"/>
<text x="40" y="223" text-anchor="start" class="lbl">Stick click: sprint</text>
<text x="40" y="259" text-anchor="start" class="sub">Until you let go of the stick</text>
<circle class="dot" cx="510" cy="304" r="6"/><path class="ln" d="M510 304 L 630 190 L 870 190"/>
<text x="750" y="178" text-anchor="middle" class="lbl">D-pad ← ↑ →: pause menu</text>
<circle class="dot" cx="510" cy="356" r="6"/><path class="ln" d="M510 356 L 630 270 L 870 270"/>
<text x="750" y="258" text-anchor="middle" class="lbl">D-pad ↓: hint screen</text>
<circle class="dot" cx="470" cy="185" r="6"/><path class="ln" d="M470 185 L 300 420 L 40 420"/>
<text x="40" y="408" text-anchor="start" class="lbl">View: pause menu</text>
<circle class="dot" cx="368" cy="380" r="6"/><path class="ln" d="M368 380 L 300 520 L 40 520"/>
<text x="40" y="508" text-anchor="start" class="lbl">Grip: grab and hold</text>
<text x="40" y="544" text-anchor="start" class="sub">Let go to drop, swing to throw</text>
<circle class="dot" cx="420" cy="575" r="6"/><path class="ln" stroke-dasharray="6 5" d="M420 575 L 300 630 L 40 630"/>
<text x="40" y="618" text-anchor="start" class="lbl">Trigger (underneath)</text>
<text x="40" y="654" text-anchor="start" class="sub">Fire / use · empty hand: force grab</text>
<circle class="dot" cx="1050" cy="260" r="6"/><path class="ln" d="M1050 260 L 1200 140 L 1460 140"/>
<text x="1460" y="128" text-anchor="end" class="lbl">Stick: turn</text>
<text x="1460" y="164" text-anchor="end" class="sub">Smooth or snap (VR settings)</text>
<circle class="dot" cx="1050" cy="260" r="6"/><path class="ln" d="M1050 260 L 1200 235 L 1460 235"/>
<text x="1460" y="223" text-anchor="end" class="lbl">Stick click: recenter</text>
<text x="1460" y="259" text-anchor="end" class="sub">Both stick clicks: save a capture</text>
<circle class="dot" cx="1004" cy="304" r="6"/><path class="ln" d="M1004 304 L 870 440 L 630 440"/>
<text x="750" y="428" text-anchor="middle" class="lbl">X, Y or B: crouch</text>
<circle class="dot" cx="1004" cy="384" r="6"/><path class="ln" d="M1004 384 L 870 520 L 630 520"/>
<text x="750" y="508" text-anchor="middle" class="lbl">A: jump</text>
<circle class="dot" cx="1030" cy="185" r="6"/><path class="ln" d="M1030 185 L 1200 420 L 1460 420"/>
<text x="1460" y="408" text-anchor="end" class="lbl">Menu: pause menu</text>
<circle class="dot" cx="1132" cy="380" r="6"/><path class="ln" d="M1132 380 L 1200 520 L 1460 520"/>
<text x="1460" y="508" text-anchor="end" class="lbl">Grip: grab and hold</text>
<text x="1460" y="544" text-anchor="end" class="sub">Let go to drop, swing to throw</text>
<circle class="dot" cx="1080" cy="575" r="6"/><path class="ln" stroke-dasharray="6 5" d="M1080 575 L 1200 630 L 1460 630"/>
<text x="1460" y="618" text-anchor="end" class="lbl">Trigger (underneath)</text>
<text x="1460" y="654" text-anchor="end" class="sub">Fire / use · empty hand: force grab</text>
<text x="750" y="742" text-anchor="middle" class="sub">Steam Frame uses SteamVR's automatic mapping of the Touch layout.  If a button differs, rebind it in SteamVR.</text>
<text x="750" y="770" text-anchor="middle" class="sub">Both hands grab, shoot and holster the same way.  LeftHanded=1 swaps the stick and button roles.  Everything can be rebound in SteamVR.</text>
</svg>