<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" font-family="Inter, 'DejaVu Sans', sans-serif">
<defs><linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4a42"/><stop offset="1" stop-color="#23302a"/></linearGradient>
<style>.lbl{font-size:21px;font-weight:700;fill:#efe6d2}.sub{font-size:17px;font-weight:500;fill:#a9c2a3}.ln{stroke:#e8a33d;stroke-width:2.5;fill:none}.dot{fill:#e8a33d}.ttl{font-size:30px;font-weight:900;fill:#efe6d2;letter-spacing:3px}.hd{font-size:36px;font-weight:900;fill:#e8a33d;letter-spacing:2px}</style></defs>
<rect width="1500" height="820" rx="24" fill="#0f2419"/>
<text x="750" y="52" text-anchor="middle" class="hd">PLAYSTATION VR2 SENSE CONTROLLERS</text>
<text x="470" y="100" text-anchor="middle" class="ttl">LEFT</text>
<text x="1030" y="100" text-anchor="middle" class="ttl">RIGHT</text>
<g transform="translate(470 420)"><path d="M-62 -18 A 118 118 0 1 1 62 -18 L 50 160 C 46 196 24 214 0 214 C -24 214 -46 196 -50 160 Z" fill="url(#body)" stroke="#5d7266" stroke-width="3"/>
<rect x="-80" y="10" width="18" height="100" rx="8" fill="#e8a33d" opacity="0.85"/><rect x="-70" y="-198" width="30" height="12" rx="6" fill="#2c3a33" stroke="#6d8378" stroke-width="2"/><circle cx="-10" cy="-125" r="38" fill="#1b2620" stroke="#6d8378" stroke-width="3"/><circle cx="-10" cy="-125" r="24" fill="#2c3a33"/><circle cx="52" cy="-140" r="18" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/><text x="52" y="-133" text-anchor="middle" font-size="19" font-weight="800" fill="#cfd9d2">△</text><circle cx="40" cy="-85" r="18" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/><text x="40" y="-78" text-anchor="middle" font-size="19" font-weight="800" fill="#cfd9d2">□</text><circle cx="-12" cy="-52" r="13" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/></g>
<g transform="translate(1030 420)"><g transform="scale(-1 1)"><path d="M-62 -18 A 118 118 0 1 1 62 -18 L 50 160 C 46 196 24 214 0 214 C -24 214 -46 196 -50 160 Z" fill="url(#body)" stroke="#5d7266" stroke-width="3"/>
<rect x="-80" y="10" width="18" height="100" rx="8" fill="#e8a33d" opacity="0.85"/></g><rect x="40" y="-198" width="30" height="12" rx="6" fill="#2c3a33" stroke="#6d8378" stroke-width="2"/><circle cx="10" cy="-125" r="38" fill="#1b2620" stroke="#6d8378" stroke-width="3"/><circle cx="10" cy="-125" r="24" fill="#2c3a33"/><circle cx="-52" cy="-140" r="18" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/><text x="-52" y="-133" text-anchor="middle" font-size="19" font-weight="800" fill="#cfd9d2">○</text><circle cx="-40" cy="-85" r="18" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/><text x="-40" y="-78" text-anchor="middle" font-size="19" font-weight="800" fill="#cfd9d2">✕</text><circle cx="12" cy="-52" r="13" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/></g>
<path class="ln" d="M415 228 L 290 140 L 40 140"/><circle class="dot" cx="415" cy="228" r="6"/>
<text x="40" y="128" text-anchor="start" class="lbl">Create: pause menu</text>
<path class="ln" d="M460 295 L 290 260 L 40 260"/><circle class="dot" cx="460" cy="295" r="6"/>
<text x="40" y="248" text-anchor="start" class="lbl">Stick: walk</text>
<text x="40" y="284" text-anchor="start" class="sub">Click: sprint, until you let go</text>
<path class="ln" d="M458 368 L 290 380 L 40 380"/><circle class="dot" cx="458" cy="368" r="6"/>
<text x="40" y="368" text-anchor="start" class="lbl">PS button: not used</text>
<path class="ln" d="M399 480 L 290 500 L 40 500"/><circle class="dot" cx="399" cy="480" r="6"/>
<text x="40" y="488" text-anchor="start" class="lbl">Grip: grab and hold</text>
<text x="40" y="524" text-anchor="start" class="sub">Let go to drop, swing to throw</text>
<path class="ln" stroke-dasharray="6 5" d="M440 634 L 290 650 L 40 650"/><circle class="dot" cx="440" cy="634" r="6"/>
