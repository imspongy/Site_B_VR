<text x="1460" y="128" text-anchor="end" class="lbl">Options: pause menu</text>
<path class="ln" d="M1040 295 L 1210 260 L 1460 260"/><circle class="dot" cx="1040" cy="295" r="6"/>
<text x="1460" y="248" text-anchor="end" class="lbl">Stick: turn</text>
<text x="1460" y="284" text-anchor="end" class="sub">Click: recenter (both: capture)</text>
<path class="ln" d="M1042 368 L 1210 380 L 1460 380"/><circle class="dot" cx="1042" cy="368" r="6"/>
<text x="1460" y="368" text-anchor="end" class="lbl">PS button: not used</text>
<path class="ln" d="M1101 480 L 1210 500 L 1460 500"/><circle class="dot" cx="1101" cy="480" r="6"/>
<text x="1460" y="488" text-anchor="end" class="lbl">Grip: grab and hold</text>
<text x="1460" y="524" text-anchor="end" class="sub">Let go to drop, swing to throw</text>
<path class="ln" stroke-dasharray="6 5" d="M1060 634 L 1210 650 L 1460 650"/><circle class="dot" cx="1060" cy="634" r="6"/>
<text x="1460" y="638" text-anchor="end" class="lbl">Trigger (underneath)</text>
<text x="1460" y="674" text-anchor="end" class="sub">Fire a gun, use what you hold</text>
<path class="ln" d="M960 280 L 880 420 L 620 420"/><circle class="dot" cx="960" cy="280" r="6"/>
<text x="750" y="408" text-anchor="middle" class="lbl">○: crouch</text>
<path class="ln" d="M972 335 L 880 500 L 620 500"/><circle class="dot" cx="972" cy="335" r="6"/>
<text x="750" y="488" text-anchor="middle" class="lbl">✕: jump</text>
<text x="750" y="762" text-anchor="middle" class="sub">On PC with the PlayStation VR2 adapter and the PlayStation VR2 app for SteamVR.</text>
<text x="750" y="790" text-anchor="middle" class="sub">Both hands grab, shoot and holster the same way.  LeftHanded=1 swaps the stick and button roles.  Everything can be rebound in SteamVR.</text>
</svg>