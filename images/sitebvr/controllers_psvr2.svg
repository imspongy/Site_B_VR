<text x="40" y="674" text-anchor="start" class="sub">Fire a gun, use what you hold</text>
<path class="ln" d="M540 280 L 620 160 L 880 160"/><circle class="dot" cx="540" cy="280" r="6"/>
<text x="750" y="148" text-anchor="middle" class="lbl">△: pause menu</text>
