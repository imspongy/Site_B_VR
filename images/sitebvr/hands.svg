<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640" font-family="Inter, 'DejaVu Sans', sans-serif">
  <defs>
    <style>
      .lbl { font-size: 21px; font-weight: 700; fill: #efe6d2; }
      .sub { font-size: 17px; font-weight: 500; fill: #a9c2a3; }
      .ttl { font-size: 26px; font-weight: 900; fill: #efe6d2; letter-spacing: 2px; }
      .fig { fill: #2c3a33; stroke: #6d8378; stroke-width: 3; }
      .zone { fill: #e8a33d; fill-opacity: 0.28; stroke: #e8a33d; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .ln { stroke: #e8a33d; stroke-width: 2.5; fill: none; }
      .arr { stroke: #e8a33d; stroke-width: 4; fill: none; stroke-linecap: round; }
      .panel { fill: #15301f; stroke: #2f4a3a; stroke-width: 2; }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e8a33d"/></marker>
  </defs>
  <rect width="1500" height="640" rx="24" fill="#0f2419"/>

  <!-- Holsters -->
  <text x="250" y="58" text-anchor="middle" class="ttl">FOUR HOLSTERS</text>
  <g transform="translate(250 330)">
    <circle cx="0" cy="-190" r="34" class="fig"/>
    <path d="M-70 -140 L 70 -140 L 58 10 L 40 40 L -40 40 L -58 10 Z" class="fig"/>
    <path d="M-40 40 L -50 230 L -18 230 L -4 60 L 4 60 L 18 230 L 50 230 L 40 40 Z" class="fig"/>
    <path d="M-70 -140 L -105 -20 L -86 -14 L -56 -110 Z" class="fig"/>
    <path d="M70 -140 L 105 -20 L 86 -14 L 56 -110 Z" class="fig"/>
    <circle cx="-78" cy="-170" r="34" class="zone"/>
    <circle cx="78" cy="-170" r="34" class="zone"/>
    <circle cx="-74" cy="38" r="34" class="zone"/>
    <circle cx="74" cy="38" r="34" class="zone"/>
  </g>
  <text x="250" y="590" text-anchor="middle" class="sub">Over each shoulder and at each hip.</text>
  <text x="250" y="614" text-anchor="middle" class="sub">Let go of something there to holster it; grip there to draw.</text>

  <!-- Panels -->
  <rect x="500" y="30" width="470" height="280" rx="18" class="panel"/>
  <text x="520" y="72" class="ttl">FORCE GRAB</text>
  <text x="520" y="112" class="lbl">Point at an item, hold the trigger,</text>
  <text x="520" y="140" class="lbl">flick your wrist toward you,</text>
  <text x="520" y="168" class="lbl">then squeeze grip to catch it.</text>
  <path class="arr" d="M540 280 C 580 220 650 220 690 262" marker-end="url(#ah)"/>
  <text x="712" y="258" class="sub">Things that matter glint</text>
  <text x="712" y="282" class="sub">(guns, key cards, switches)</text>

  <rect x="1000" y="30" width="470" height="280" rx="18" class="panel"/>
  <text x="1020" y="72" class="ttl">TWO-HANDED GUNS</text>
  <text x="1020" y="112" class="lbl">Grip the gun the other hand holds:</text>
  <text x="1020" y="146" class="sub">Rifles and shotguns: hand ahead of the gun hand,</text>
  <text x="1020" y="170" class="sub">near the barrel. The gun aims along your hands.</text>
  <text x="1020" y="204" class="sub">Pistols: your hand wraps the grip to steady it.</text>
  <text x="1020" y="238" class="sub">GunAdjust=1: the stick moves the gun in your hand,</text>
  <text x="1020" y="262" class="sub">stick pressed in moves it forward and back.</text>

  <rect x="500" y="330" width="470" height="280" rx="18" class="panel"/>
  <text x="520" y="372" class="ttl">THROW, PUSH, SWING</text>
  <text x="520" y="412" class="lbl">Swing and let go to throw.</text>
  <text x="520" y="446" class="sub">Heavier things trail and sag in your hand.</text>
  <text x="520" y="474" class="sub">Your hands and body push things over.</text>
  <text x="520" y="502" class="sub">Doors, gates and wheels turn on their hinges.</text>
  <text x="520" y="530" class="sub">Swing bats and pipes to hit things.</text>
  <text x="520" y="558" class="sub">Guns kick with recoil; controllers vibrate.</text>

  <rect x="1000" y="330" width="470" height="280" rx="18" class="panel"/>
  <text x="1020" y="372" class="ttl">KEYPADS AND MENUS</text>
  <text x="1020" y="412" class="lbl">Press keypad keys with your fingertip.</text>
  <text x="1020" y="446" class="sub">Anne points her finger at keypads and phones.</text>
  <text x="1020" y="474" class="sub">Each press counts once.</text>
  <text x="1020" y="516" class="lbl">Menus float in front of you:</text>
  <text x="1020" y="550" class="sub">point and pull the trigger to click.</text>
</svg>
