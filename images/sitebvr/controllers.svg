<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" font-family="Inter, 'DejaVu Sans', sans-serif">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4a42"/><stop offset="1" stop-color="#23302a"/></linearGradient>
    <style>
      .lbl { font-size: 21px; font-weight: 700; fill: #efe6d2; }
      .sub { font-size: 17px; font-weight: 500; fill: #a9c2a3; }
      .ln  { stroke: #e8a33d; stroke-width: 2.5; fill: none; }
      .dot { fill: #e8a33d; }
      .ttl { font-size: 30px; font-weight: 900; fill: #efe6d2; letter-spacing: 3px; }
    </style>
  </defs>
  <rect width="1500" height="780" rx="24" fill="#0f2419"/>
  <text x="470" y="62" text-anchor="middle" class="ttl">LEFT CONTROLLER</text>
  <text x="1030" y="62" text-anchor="middle" class="ttl">RIGHT CONTROLLER</text>
  <g transform="translate(470 390)"><path d="M-95 -170 C -95 -230 95 -230 95 -170 L 80 60 C 70 120 40 190 0 190 C -40 190 -70 120 -80 60 Z" fill="url(#body)" stroke="#5d7266" stroke-width="3"/>
    <rect x="-112" y="-80" width="20" height="120" rx="9" fill="#e8a33d" opacity="0.85"/>
    <circle cx="-20" cy="-140" r="42" fill="#1b2620" stroke="#6d8378" stroke-width="3"/>
    <circle cx="-20" cy="-140" r="26" fill="#2c3a33"/>
    <circle cx="48" cy="-90" r="20" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/>
    <circle cx="36" cy="-40" r="20" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/>
    <rect x="-36" y="-20" width="26" height="12" rx="6" fill="#2c3a33" stroke="#6d8378" stroke-width="2"/></g>
  <g transform="translate(1030 390) scale(-1 1)"><path d="M-95 -170 C -95 -230 95 -230 95 -170 L 80 60 C 70 120 40 190 0 190 C -40 190 -70 120 -80 60 Z" fill="url(#body)" stroke="#5d7266" stroke-width="3"/>
    <rect x="-112" y="-80" width="20" height="120" rx="9" fill="#e8a33d" opacity="0.85"/>
    <circle cx="-20" cy="-140" r="42" fill="#1b2620" stroke="#6d8378" stroke-width="3"/>
    <circle cx="-20" cy="-140" r="26" fill="#2c3a33"/>
    <circle cx="48" cy="-90" r="20" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/>
    <circle cx="36" cy="-40" r="20" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/>
    <rect x="-36" y="-20" width="26" height="12" rx="6" fill="#2c3a33" stroke="#6d8378" stroke-width="2"/></g>
  <circle class="dot" cx="450" cy="250" r="6"/><path class="ln" d="M450 250 L 300 140 L 40 140"/>
<text x="40" y="128" text-anchor="start" class="lbl">Stick: walk</text>
<text x="40" y="164" text-anchor="start" class="sub">Push further to go faster</text>
<circle class="dot" cx="450" cy="250" r="6"/><path class="ln" d="M450 250 L 300 235 L 40 235"/>
<text x="40" y="223" text-anchor="start" class="lbl">Stick click: sprint</text>
<text x="40" y="259" text-anchor="start" class="sub">Until you let go of the stick</text>
<circle class="dot" cx="518" cy="300" r="6"/><path class="ln" d="M518 300 L 640 180 L 860 180"/>
<text x="750" y="168" text-anchor="middle" class="lbl">Left Y / △: pause menu</text>
<circle class="dot" cx="506" cy="350" r="6"/><path class="ln" d="M506 350 L 640 260 L 860 260"/>
<text x="750" y="248" text-anchor="middle" class="lbl">Left X / □: hint screen</text>
<circle class="dot" cx="447" cy="376" r="6"/><path class="ln" d="M447 376 L 300 420 L 40 420"/>
<text x="40" y="408" text-anchor="start" class="lbl">Menu: pause menu</text>
<circle class="dot" cx="368" cy="370" r="6"/><path class="ln" d="M368 370 L 300 520 L 40 520"/>
<text x="40" y="508" text-anchor="start" class="lbl">Grip: grab and hold</text>
<text x="40" y="544" text-anchor="start" class="sub">Let go to drop, swing to throw</text>
<circle class="dot" cx="420" cy="565" r="6"/><path class="ln" stroke-dasharray="6 5" d="M420 565 L 300 630 L 40 630"/>
<text x="40" y="618" text-anchor="start" class="lbl">Trigger (underneath)</text>
<text x="40" y="654" text-anchor="start" class="sub">Fire / use · empty hand: force grab</text>
<circle class="dot" cx="1050" cy="250" r="6"/><path class="ln" d="M1050 250 L 1200 140 L 1460 140"/>
<text x="1460" y="128" text-anchor="end" class="lbl">Stick: turn</text>
<text x="1460" y="164" text-anchor="end" class="sub">Smooth or snap (VR settings)</text>
<circle class="dot" cx="1050" cy="250" r="6"/><path class="ln" d="M1050 250 L 1200 235 L 1460 235"/>
<text x="1460" y="223" text-anchor="end" class="lbl">Stick click: recenter</text>
<text x="1460" y="259" text-anchor="end" class="sub">Both stick clicks: save a capture</text>
<circle class="dot" cx="982" cy="300" r="6"/><path class="ln" d="M982 300 L 860 430 L 640 430"/>
<text x="750" y="418" text-anchor="middle" class="lbl">Right B / ○: crouch</text>
<circle class="dot" cx="994" cy="350" r="6"/><path class="ln" d="M994 350 L 860 510 L 640 510"/>
<text x="750" y="498" text-anchor="middle" class="lbl">Right A / ✕: jump</text>
<circle class="dot" cx="1053" cy="376" r="6"/><path class="ln" d="M1053 376 L 1200 420 L 1460 420"/>
<text x="1460" y="408" text-anchor="end" class="lbl">Menu: pause menu</text>
<circle class="dot" cx="1132" cy="370" r="6"/><path class="ln" d="M1132 370 L 1200 520 L 1460 520"/>
<text x="1460" y="508" text-anchor="end" class="lbl">Grip: grab and hold</text>
<text x="1460" y="544" text-anchor="end" class="sub">Let go to drop, swing to throw</text>
<circle class="dot" cx="1080" cy="565" r="6"/><path class="ln" stroke-dasharray="6 5" d="M1080 565 L 1200 630 L 1460 630"/>
<text x="1460" y="618" text-anchor="end" class="lbl">Trigger (underneath)</text>
<text x="1460" y="654" text-anchor="end" class="sub">Fire / use · empty hand: force grab</text>
  <text x="750" y="740" text-anchor="middle" class="sub">Both hands grab, shoot and holster the same way.  LeftHanded=1 swaps the stick and button roles.  Everything can be rebound in SteamVR.</text>
</svg>