<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" font-family="Inter, 'DejaVu Sans', sans-serif">
<defs><linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4a42"/><stop offset="1" stop-color="#23302a"/></linearGradient>
<style>.lbl{font-size:21px;font-weight:700;fill:#efe6d2}.sub{font-size:17px;font-weight:500;fill:#a9c2a3}.ln{stroke:#e8a33d;stroke-width:2.5;fill:none}.dot{fill:#e8a33d}.ttl{font-size:30px;font-weight:900;fill:#efe6d2;letter-spacing:3px}.hd{font-size:36px;font-weight:900;fill:#e8a33d;letter-spacing:2px}</style></defs>
<rect width="1500" height="820" rx="24" fill="#0f2419"/>
<text x="750" y="52" text-anchor="middle" class="hd">META QUEST TOUCH CONTROLLERS</text>
<text x="470" y="100" text-anchor="middle" class="ttl">LEFT</text>
<text x="1030" y="100" text-anchor="middle" class="ttl">RIGHT</text>
