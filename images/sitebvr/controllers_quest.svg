<rect x="-80" y="10" width="18" height="100" rx="8" fill="#e8a33d" opacity="0.85"/><circle cx="-40" cy="-125" r="38" fill="#1b2620" stroke="#6d8378" stroke-width="3"/><circle cx="-40" cy="-125" r="24" fill="#2c3a33"/><circle cx="42" cy="-150" r="18" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/><text x="42" y="-143" text-anchor="middle" font-size="19" font-weight="800" fill="#cfd9d2">Y</text><circle cx="28" cy="-92" r="18" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/><text x="28" y="-85" text-anchor="middle" font-size="19" font-weight="800" fill="#cfd9d2">X</text><circle cx="-34" cy="-48" r="13" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/></g>
<g transform="translate(1030 420)"><g transform="scale(-1 1)"><path d="M-62 -18 A 118 118 0 1 1 62 -18 L 50 160 C 46 196 24 214 0 214 C -24 214 -46 196 -50 160 Z" fill="url(#body)" stroke="#5d7266" stroke-width="3"/>
<rect x="-80" y="10" width="18" height="100" rx="8" fill="#e8a33d" opacity="0.85"/></g><circle cx="40" cy="-125" r="38" fill="#1b2620" stroke="#6d8378" stroke-width="3"/><circle cx="40" cy="-125" r="24" fill="#2c3a33"/><circle cx="-42" cy="-150" r="18" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/><text x="-42" y="-143" text-anchor="middle" font-size="19" font-weight="800" fill="#cfd9d2">B</text><circle cx="-28" cy="-92" r="18" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/><text x="-28" y="-85" text-anchor="middle" font-size="19" font-weight="800" fill="#cfd9d2">A</text><circle cx="34" cy="-48" r="13" fill="#2c3a33" stroke="#6d8378" stroke-width="3"/></g>
<path class="ln" d="M430 295 L 290 150 L 40 150"/><circle class="dot" cx="430" cy="295" r="6"/>
<text x="40" y="138" text-anchor="start" class="lbl">Stick: walk</text>
<text x="40" y="174" text-anchor="start" class="sub">Click: sprint, until you let go</text>
<path class="ln" d="M436 372 L 290 320 L 40 320"/><circle class="dot" cx="436" cy="372" r="6"/>
<text x="40" y="308" text-anchor="start" class="lbl">☰ Menu: pause menu</text>
<path class="ln" d="M399 480 L 290 500 L 40 500"/><circle class="dot" cx="399" cy="480" r="6"/>
<text x="40" y="488" text-anchor="start" class="lbl">Grip: grab and hold</text>
<text x="40" y="524" text-anchor="start" class="sub">Let go to drop, swing to throw</text>
