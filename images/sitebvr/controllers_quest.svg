<text x="1460" y="138" text-anchor="end" class="lbl">Stick: turn</text>
<text x="1460" y="174" text-anchor="end" class="sub">Click: recenter (both: capture)</text>
<path class="ln" d="M1064 372 L 1210 320 L 1460 320"/><circle class="dot" cx="1064" cy="372" r="6"/>
<text x="1460" y="308" text-anchor="end" class="lbl">Meta button: not used</text>
<path class="ln" d="M1101 480 L 1210 500 L 1460 500"/><circle class="dot" cx="1101" cy="480" r="6"/>
<text x="1460" y="488" text-anchor="end" class="lbl">Grip: grab and hold</text>
<text x="1460" y="524" text-anchor="end" class="sub">Let go to drop, swing to throw</text>
<path class="ln" stroke-dasharray="6 5" d="M1060 634 L 1210 650 L 1460 650"/><circle class="dot" cx="1060" cy="634" r="6"/>
<text x="1460" y="638" text-anchor="end" class="lbl">Trigger (underneath)</text>
<text x="1460" y="674" text-anchor="end" class="sub">Fire a gun, use what you hold</text>
<path class="ln" d="M970 270 L 880 420 L 620 420"/><circle class="dot" cx="970" cy="270" r="6"/>
<text x="750" y="408" text-anchor="middle" class="lbl">B: crouch</text>
<path class="ln" d="M984 328 L 880 500 L 620 500"/><circle class="dot" cx="984" cy="328" r="6"/>
<text x="750" y="488" text-anchor="middle" class="lbl">A: jump</text>
<text x="750" y="762" text-anchor="middle" class="sub">Quest 2, Quest 3 and Quest Pro, played through Link, Air Link or Virtual Desktop.</text>
<text x="750" y="790" text-anchor="middle" class="sub">Both hands grab, shoot and holster the same way.  LeftHanded=1 swaps the stick and button roles.  Everything can be rebound in SteamVR.</text>
