name: Build Trespasser VR

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        working-directory: jp2_pc
        run: cmake -G "Visual Studio 17 2022" -A Win32 -S . -B Build/CI -D USE_TRESPASSER_DIRECTORY=false

      - name: Check the VR renderer's shaders
        shell: pwsh
        run: python tools/check_shaders.py jp2_pc/Source/Trespass/VRRender.cpp

      - name: Build (Final = fast)
        working-directory: jp2_pc
        run: cmake --build Build/CI --config Final --target trespass -- /m

      - name: Build (Release = extra checks and logs)
        working-directory: jp2_pc
        run: cmake --build Build/CI --config Release --target trespass -- /m

      - name: Build the setup (SiteBVR-Setup.exe)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /EHsc /O2 /std:c++17 /MT /W3 tools\setup\SiteBVRSetup.cpp /Fe:tools\setup\SiteBVR-Setup.exe /link /SUBSYSTEM:WINDOWS"
          if (!(Test-Path tools\setup\SiteBVR-Setup.exe)) { exit 1 }

      - name: Package
        shell: pwsh
        working-directory: jp2_pc
        run: |
          $out = New-Item -ItemType Directory -Force -Path package
          Copy-Item Build/CI/cmake/trespass/Final/OpenTrespasser.exe $out
          Copy-Item Build/CI/cmake/trespass/Release/OpenTrespasser.exe $out/OpenTrespasser-Release.exe
          Copy-Item Build/CI/cmake/trespass/Final/openvr_api.dll $out
          Copy-Item Distribution/Binary/SMACKW32.DLL $out
          Copy-Item Distribution/Binary/README.txt $out/OpenTrespasser-README.txt
          # VR-friendly config: borderless window with a near-square render size.
          (Get-Content Distribution/Binary/OpenTrespasser.ini) `
            -replace '^Width=.*','Width=1024' `
            -replace '^Height=.*','Height=1024' `
            -replace '^WindowMode=.*','WindowMode=2' |
            Set-Content $out/OpenTrespasser.ini
          Copy-Item ../VR-README.md $out/VR-README.md
          Copy-Item ../VR/JurassicPark.ttf $out/JurassicPark.ttf
          New-Item -ItemType Directory -Force -Path $out/menu | Out-Null
          Copy-Item ../VR/menu/vrsettings.ddf $out/menu/vrsettings.ddf
          Copy-Item ../VR/menu/ingameopt_vr_addition.ddf $out/menu/ingameopt_vr_addition.ddf
          Copy-Item Build/CI/cmake/trespass/Final/*.map $out/OpenTrespasser.map
          Copy-Item Build/CI/cmake/trespass/Release/*.map $out/OpenTrespasser-Release.map
          Copy-Item ../tools/setup/SiteBVR-Setup.exe $out/SiteBVR-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: TrespasserVR
          path: jp2_pc/package/

      - uses: actions/upload-artifact@v4
        with:
          name: maps
          path: jp2_pc/Build/CI/cmake/trespass/**/*.map
          if-no-files-found: warn

      # Latest build as a downloadable release (a direct link that needs no GitHub sign-in).
      - name: Publish latest build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/vr-mod'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path jp2_pc/package/* -DestinationPath SiteB-VR.zip -Force
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest SiteB-VR.zip --target $env:GITHUB_SHA --prerelease --title "Site B VR (latest build)" --notes "Automatic build of $env:GITHUB_SHA"
