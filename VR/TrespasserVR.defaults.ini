; Site B VR settings.  Changes take effect within a couple of seconds, even in game.
; Delete this file to restore defaults.
[VR]
Version=20
; 0 = play on the monitor as normal.
Enabled=1

; --- Movement ---
; Walking speed (metres per second) with the stick pushed all the way.
MoveSpeed=2.230
; Sprint speed, 4.5 at most (click the walk stick to sprint; letting go of the stick stops it).
RunSpeed=4.5
; How quickly you speed up and slow down (seconds). 0 = instant.
MoveAcceleration=0.15
MoveDeadzone=0.12
; Jump height (1 = original game).
JumpHeight=2
; 0 = walk where you look, 1 = walk where your off hand points.
MoveWithHand=0
; How far (metres) your head can go from Anne's body when she is blocked by a wall.
BodyLeash=0.4
; Seconds of smoothing on view height over stairs and slopes (0 = none).
HeightSmoothing=0.1

; --- Turning ---
; 0 = snap turn, 1 = smooth turn.
SmoothTurn=1.000
; Degrees per snap.
SnapTurnDegrees=45.000
; Degrees per second at full stick (smooth turn).
SmoothTurnSpeed=151.200
TurnDeadzone=0.2

; --- Hands ---
; 1 = swap the sticks and face buttons for left-handed play. Both hands always work the same.
LeftHanded=0.000
; 0 = hold the grip to keep holding things (let go to drop).
; 1 = press grip once to grab, press again to drop.
GripToggle=0.000
; Point at an item, hold the trigger and flick your wrist to pull it to you.
ForceGrab=1
; Grab the other hand's gun to aim it with both hands.
TwoHandAim=1
; Anne's left arm on your left controller.
SecondHand=1
; Guns lighter than this (kg) count as pistols for the two-handed grip.
PistolMaxMass=2.5
; How close (metres) your hand must be to a holster (hip / over shoulder).
HolsterRadius=0.25
; The hip holsters reach this many times less far out in front of you (bigger = less).
HipFrontScale=3
; How far back toward your hips (metres), and how far down, the hip holsters sit.
HipBack=0.15
HipDown=0.06
; Vibration strength. 0 = off, 1 = normal, 2 = strong.
Haptics=1.000
; Rotate the in-game hand relative to your controller (degrees).
; If guns aim too high, try HandPitch=-20.  (0 = fingers pointing along the controller.)
HandPitch=0
HandYaw=0
HandRoll=0
; Size of the drawn hands (1 = Anne's original, rather large, hands).
HandScale=0.75
; Size of Anne's arms (1 = the game's; smaller lets them straighten when you reach out).
ArmScale=0.85

; --- View ---
; Sky: 0 = solid colour, 1 = smooth gradient, 2 = clouds.
SkyMode=2
; 1 = use the game's low-detail stand-ins for distant objects (faster, but causes
;     pop-in and blocky distant objects in VR).
ImageCaches=0
; 1 = haze depends on real distance, so it doesn't change as you turn your head.
RadialFog=1
; How far away objects and buildings are drawn, and how far they keep full detail
;     (1 = original game, 3 = three times as far).  Higher costs frame rate.
DrawDistance=8.000
; 1 = let the game skip objects it thinks are hidden behind big ones (walls, rocks).  Off by
;     default in VR: it can hide things right in front of you.
Occlusion=1
; 1 = more accurate texture perspective: less wobble and shimmer up close (a bit slower).
SharpTextures=1
; 1 = also show the game on your monitor (much slower). Use SteamVR's
;     'Display VR View' to watch or record instead.
MirrorToMonitor=0
; Cutscenes: how far (metres) you can lean before the view stops following.
LeanRadius=0.6
; Size and distance (metres) of the floating menu screen.
MenuScreenWidth=2.4
MenuScreenDistance=2.0

; EXPERIMENTAL: 1 = draw with the graphics card (the game's Direct3D mode) instead of
;     the CPU.  Needed for high resolutions at high frame rates.  Takes effect on restart.
HardwareRendering=0

; --- Graphics (modern renderer) ---
; 1 = draw the world with the modern GPU renderer: headset resolution, anti-aliasing,
;     real-time shadows, high frame rates.  0 = the game's original renderer.
;     Takes effect on restart.
NewRenderer=1
; Eye image size relative to what SteamVR recommends for your headset (1 = native).
RenderScale=1.0
; Anti-aliasing samples: 1 (off), 2, 4 or 8.
MSAA=4
; Shadow map size (0 = no shadows) and how far around you shadows are drawn (metres).
ShadowMapSize=4096
ShadowDistance=60
; Overall brightness.
Brightness=1.0
; Terrain mesh and texture detail (0.5 = half, 2 = double).  Applies on the next level load.
TerrainDetail=1.0
; The game's fog, spread over this many times its normal view distance (1 = original).
FogScale=1.3
; 1 = your real floor is the game's floor: you stand at your own height and crouch for
;     real, and Anne's body is drawn at your height.  0 = Anne's own eye height.
RealHeight=1.000
; Anne's own eye height (m).  If her body sits too low under your view, lower this; too high, raise it.
AnneEyeHeight=1.55
; 1 = Anne's body hangs from your view, so her head is always at yours.  0 = her feet on the ground.
BodyFromView=1
; With BodyFromView: how far below your eyes her head sits (m).  Raise it if her body is too high, lower it if too low.
HeadBelowEye=0.07
; Extra height (metres) added to yours in the game.
ExtraHeight=0.0

; --- Guns and throwing ---
; How far guns sit back into the palm and across toward its middle (metres), and how big
; held guns are drawn (1 = the game's size).
GunBack=0.04
GunSide=-0.05
; The same sideways setting for pistols, the two shotguns and any other gun.
; (Bigger = further in toward the middle of your body.)
PistolSide=0.01
ShotgunSide=0.04
Shotgun2Side=0.01
GunSideOther=0.01
; How far up the shotguns sit in your hand (Shotgun = the first one, 8 shells;
; Shotgun2 = the one in level 2, 7 shells).  Negative = down.
ShotgunUp=-0.01
Shotgun2Up=0.09
GunScale=0.85
; How much guns kick (0 = none).
Recoil=1.0
; Debugging: 1 draws the game's collision boxes near you (red = solid, blue = not).
ShowPhysics=0
; Thrown things go this much faster than your hand.
ThrowScale=2.0
; How much higher (metres) your supporting hand is drawn on the shotgun's forend.
ShotgunHandUp=-0.03
; The same on the first shotgun (8 shells).
Shotgun1HandUp=0.01
; How much of your wrist's twist her forearm follows (0 none, 1 all).
ForearmTwist=0.75
; The hand cupping under a pistol, moved out from under the gun hand (m).
; Steadying a pistol: 1 wraps the front of the grip, 0 cups under it.
PistolSupport=1
CupSide=0.02
; The burst pistol's cupping hand, and the submachine gun's supporting hand, further to
; your left (m).
BurstCupLeft=0.03
SmgHandLeft=0.04
SmgHandUp=0.03
; How much lower (metres) your supporting hand is drawn on the rifle.
RifleHandDown=0.03
; Voice-over subtitles floating below your view: 1 on, 0 off.
Subtitles=1.000
; Tutorial and hint messages (with VR controls) in front of you: 1 on, 0 off.
Tutorial=1.000
; Which controllers the button pictures in messages show: 0 work it out, 1 PlayStation
; VR2 Sense, 2 Touch (A B X Y), 3 Index, 4 Vive.
ButtonPictures=0

; --- Debug ---
; Set to 1 if the image looks skewed or doubled.
FlipFovX=0
FlipFovY=0
; Set to 1 if the menu laser moves up when you point down.
MenuFlipY=0
; Set to 1 if the left hand's fingers bend backwards when you squeeze.
FlipSecondHandCurl=0
; Set to 1 to draw a test copy of the right arm 25 cm left of your right hand.
LeftArmTest=0

; --- Gun placement per kind and hand (metres) ---
; Side: bigger = further in toward the middle of your body.  Up: negative = down.
; Shotgun = the first one (8 shells), Shotgun2 = the level 2 one (7 shells),
; Rifle = hunting rifle and sniper, OtherGun = the submachine gun.
; GunAdjust=1: the stick on the hand holding a gun moves it in your hand (left/right,
; up/down) instead of walking or turning; let go of the stick to save it here.
GunAdjust=0
PistolSideRight=0.01
PistolSideLeft=0.01
PistolUpRight=-0.012
PistolUpLeft=0.006
ShotgunSideRight=0.040
ShotgunSideLeft=0.04
ShotgunUpRight=0.038
ShotgunUpLeft=0.016
Shotgun2SideRight=-0.01
Shotgun2SideLeft=0.01
Shotgun2UpRight=0.069
Shotgun2UpLeft=0.07
RifleSideRight=-0.05
RifleSideLeft=-0.05
RifleUpRight=0.010
RifleUpLeft=0.0
OtherGunSideRight=0.01
OtherGunSideLeft=0.01
OtherGunUpRight=0.002
OtherGunUpLeft=0.0
; Bats, pipes and the like: tipped up this many degrees (negative tips them down), and size.
MeleeTilt=45
MeleeScale=0.7
; Melee damage (bats, pipes, sticks swung in the hand).
MeleeDamage=0.6
; Guns and story items sparkle until you first pick them up.
Glints=1.000
